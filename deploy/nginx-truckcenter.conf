# Host nginx site for the TRUCK CENTER Mini App on a shared server.
# Serves the built Mini App and reverse-proxies the API to the backend container
# (docker-compose.server.yml → 127.0.0.1:8001). TLS via the existing Let's Encrypt cert.
#
# Install:
#   sudo cp deploy/nginx-truckcenter.conf /etc/nginx/sites-available/truckcenter
#   sudo ln -sf /etc/nginx/sites-available/truckcenter /etc/nginx/sites-enabled/truckcenter
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 3-227-184-179.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3-227-184-179.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/3-227-184-179.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-227-184-179.sslip.io/privkey.pem;

    root /home/ubuntu/os_truckbot/miniapp/dist;
    index index.html;
    client_max_body_size 12M;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }
    location /telegram/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
