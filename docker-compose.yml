services:
  db:
    image: postgres:16-alpine
    container_name: truckbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckbot
      POSTGRES_PASSWORD: truckbot
      POSTGRES_DB: truckbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: truckbot_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is "db", not localhost
      DATABASE_URL: postgresql+asyncpg://truckbot:truckbot@db:5432/truckbot
      DATABASE_URL_SYNC: postgresql+psycopg://truckbot:truckbot@db:5432/truckbot
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - media:/app/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.run &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  media:
