# Deploy variant for a host that already runs nginx + TLS (shared server).
# Runs only db + backend; the backend is published on 127.0.0.1:8001 for the host
# nginx to reverse-proxy. The Mini App static is built separately and served by host nginx.
# See deploy/DEPLOY.md ("Shared server" section) and deploy/nginx-truckcenter.conf.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truckbot}
      POSTGRES_DB: truckbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://truckbot:${POSTGRES_PASSWORD:-truckbot}@db:5432/truckbot
      DATABASE_URL_SYNC: postgresql+psycopg://truckbot:${POSTGRES_PASSWORD:-truckbot}@db:5432/truckbot
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media:/app/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.run &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

volumes:
  pgdata:
  media:
