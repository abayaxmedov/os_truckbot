# Production stack: PostgreSQL + backend (FastAPI + bot, webhook) + Caddy (static Mini App + auto-HTTPS).
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env file (see .env.prod.example) with real secrets — never committed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truckbot}
      POSTGRES_DB: truckbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://truckbot:${POSTGRES_PASSWORD:-truckbot}@db:5432/truckbot
      DATABASE_URL_SYNC: postgresql+psycopg://truckbot:${POSTGRES_PASSWORD:-truckbot}@db:5432/truckbot
    volumes:
      - media:/app/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.run &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
